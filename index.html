<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Turn My Mess Into a Swim Game</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.container {
  max-width: 700px;
  margin: 0 auto;
}

h1 {
  font-size: 30px;
  margin: 10px 0 8px;
}

.subtitle {
  color: #bbb;
  font-size: 16px;
  line-height: 1.4;
  margin-bottom: 25px;
}

/* MICROPHONE */

#micButton {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  border: none;
  background: #d94b32;
  color: white;
  font-size: 65px;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(0,0,0,0.5);
  margin: 10px auto;
  display: block;
}

#micButton:hover {
  background: #ec5b3d;
}

#micButton.recording {
  background: #ff2d1b;
  animation: pulse 1.2s infinite;
}

@keyframes pulse {
  0% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.08);
  }

  100% {
    transform: scale(1);
  }
}

#recordingStatus {
  min-height: 24px;
  margin: 12px 0 20px;
  color: #ff8068;
  font-weight: bold;
}

/* TEXT AREA */

textarea {
  width: 100%;
  min-height: 180px;
  resize: vertical;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #444;
  background: #222;
  color: white;
  font-size: 17px;
  line-height: 1.5;
}

textarea::placeholder {
  color: #888;
}

/* GENERATE BUTTON */

.generate {
  width: 100%;
  margin-top: 15px;
  padding: 17px;
  border: none;
  border-radius: 10px;
  background: #e05a38;
  color: white;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
}

.generate:hover {
  background: #f06a45;
}

.generate:disabled {
  opacity: 0.6;
  cursor: wait;
}

/* RESULT */

#resultCard {
  margin-top: 30px;
  background: #1d1d1d;
  border-radius: 14px;
  padding: 20px;
  text-align: left;
  display: none;
}

#result {
  white-space: pre-wrap;
  line-height: 1.5;
  font-size: 16px;
}

/* ACTION BUTTONS */

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 20px;
}

.actions button {
  flex: 1;
  min-width: 100px;
  padding: 12px;
  border: 1px solid #555;
  border-radius: 8px;
  background: #292929;
  color: white;
  cursor: pointer;
}

.actions button:hover {
  background: #3a3a3a;
}

@media (max-width: 500px) {

  body {
    padding: 15px;
  }

  h1 {
    font-size: 25px;
  }

  #micButton {
    width: 125px;
    height: 125px;
    font-size: 55px;
  }

}

</style>
</head>

<body>

<div class="container">

  <h1>Turn My Mess Into a Swim Game</h1>

  <div class="subtitle">
    Click the microphone button above and record your mess,
    or copy/paste your mess in this text field.
  </div>

  <button id="micButton" onclick="toggleRecording()">🎙️</button>

  <div id="recordingStatus">
    Click the microphone to start recording.
  </div>

  <textarea
    id="mess"
    placeholder="Tell me your messy swim game idea here..."
  ></textarea>

  <button class="generate" onclick="generateGame()">
    Turn My Mess Into A Swim Game
  </button>

  <div id="resultCard">

    <div id="result"></div>

    <div class="actions">

      <button onclick="copyResult()">Copy</button>

      <button onclick="downloadResult()">Download</button>

      <button onclick="shareResult()">Share</button>

      <button onclick="printResult()">Print</button>

      <button onclick="saveResult()">Save</button>

      <button onclick="clearAll()">Clear</button>

    </div>

  </div>

</div>


<script>

/* =========================================================
   APPS SCRIPT BACKEND
   ========================================================= */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxf4n39tX-1olKwTeZIvg34J_jTHbDbBu8gfRu3pgsdWaL3sih3mNZwJPxrugHCGvpRvw/exec";


/* =========================================================
   SPEECH RECOGNITION
   ========================================================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;
let isRecording = false;
let finalTranscript = "";


function setupRecognition() {

  if (!SpeechRecognition) {

    document.getElementById("recordingStatus").innerText =
      "Browser speech recognition isn't available. You can use your phone keyboard microphone instead.";

    return false;
  }

  recognition = new SpeechRecognition();

  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = "en-CA";


  recognition.onstart = function() {

    isRecording = true;

    document
      .getElementById("micButton")
      .classList.add("recording");

    document.getElementById("recordingStatus").innerText =
      "Recording... speak your messy game idea. Click the microphone again when you're finished.";

  };


  recognition.onresult = function(event) {

    let interimTranscript = "";

    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {

      const transcript =
        event.results[i][0].transcript;

      if (event.results[i].isFinal) {

        finalTranscript += transcript + " ";

      } else {

        interimTranscript += transcript;

      }

    }

    document.getElementById("mess").value =
      finalTranscript + interimTranscript;

  };


  recognition.onerror = function(event) {

    console.log("Speech recognition error:", event.error);

    if (event.error === "not-allowed") {

      document.getElementById("recordingStatus").innerText =
        "Microphone permission was blocked. Please allow microphone access.";

      isRecording = false;

      document
        .getElementById("micButton")
        .classList.remove("recording");

    }

    else if (event.error === "no-speech") {

      document.getElementById("recordingStatus").innerText =
        "I didn't hear anything. Keep speaking or click the microphone again.";

    }

    else {

      document.getElementById("recordingStatus").innerText =
        "Speech recognition error: " + event.error;

    }

  };


  recognition.onend = function() {

    if (isRecording) {

      try {
        recognition.start();
      } catch (e) {
        console.log(e);
      }

    }

  };


  return true;
}


/* =========================================================
   MICROPHONE BUTTON
   ========================================================= */

function toggleRecording() {

  if (!SpeechRecognition) {

    document.getElementById("recordingStatus").innerText =
      "Browser speech recognition isn't available. You can use your phone keyboard microphone instead.";

    return;

  }


  if (!recognition) {

    if (!setupRecognition()) {
      return;
    }

  }


  if (isRecording) {

    stopRecording();

  } else {

    finalTranscript =
      document.getElementById("mess").value.trim();

    if (finalTranscript) {
      finalTranscript += " ";
    }

    try {

      recognition.start();

    } catch (e) {

      console.log(e);

    }

  }

}


function stopRecording() {

  isRecording = false;

  document
    .getElementById("micButton")
    .classList.remove("recording");

  document.getElementById("recordingStatus").innerText =
    "Recording stopped.";

  if (recognition) {

    try {
      recognition.stop();
    } catch (e) {
      console.log(e);
    }

  }

}


/* =========================================================
   GENERATE THE SWIM GAME
   ========================================================= */

async function generateGame() {

  const mess =
    document.getElementById("mess").value.trim();


  if (!mess) {

    alert(
      "Please record or type your messy game idea first."
    );

    return;

  }


  stopRecording();


  const button =
    document.querySelector(".generate");


  button.disabled = true;

  button.innerText =
    "Turning your mess into a swim game...";


  document.getElementById("resultCard").style.display =
    "block";


  document.getElementById("result").innerText =
    "Working on it...";


  try {

    const response = await fetch(
      APPS_SCRIPT_URL,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body: JSON.stringify({
          mess: mess
        })
      }
    );


    const text =
      await response.text();


    if (!response.ok) {

      throw new Error(
        text || "Something went wrong."
      );

    }


    document.getElementById("result").innerText =
      text;


  } catch (error) {

    console.error(error);

    document.getElementById("result").innerText =
      "Something went wrong connecting to the game generator.\n\n" +
      error.message;

  }


  button.disabled = false;

  button.innerText =
    "Turn My Mess Into A Swim Game";

}


/* =========================================================
   COPY
   ========================================================= */

function copyResult() {

  const text =
    document.getElementById("result").innerText;

  navigator.clipboard.writeText(text);

}


/* =========================================================
   DOWNLOAD
   ========================================================= */

function downloadResult() {

  const text =
    document.getElementById("result").innerText;

  const blob =
    new Blob(
      [text],
      { type: "text/plain" }
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "swim-game.txt";

  a.click();

  URL.revokeObjectURL(url);

}


/* =========================================================
   SHARE
   ========================================================= */

async function shareResult() {

  const text =
    document.getElementById("result").innerText;


  if (navigator.share) {

    try {

      await navigator.share({
        title:
          "My Swim Game",
        text:
          text
      });

    } catch (e) {

      console.log(e);

    }

  } else {

    copyResult();

    alert(
      "Your swim game was copied to the clipboard."
    );

  }

}


/* =========================================================
   PRINT
   ========================================================= */

function printResult() {

  const text =
    document.getElementById("result").innerText;


  const printWindow =
    window.open(
      "",
      "_blank"
    );


  printWindow.document.write(
    "<html><head><title>Swim Game</title></head><body>" +
    "<pre style='white-space:pre-wrap;font-family:Arial;font-size:16px;'>" +
    escapeHtml(text) +
    "</pre></body></html>"
  );


  printWindow.document.close();

  printWindow.print();

}


function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.innerText = text;

  return div.innerHTML;

}


/* =========================================================
   SAVE
   ========================================================= */

function saveResult() {

  const text =
    document.getElementById("result").innerText;

  localStorage.setItem(
    "savedSwimGame",
    text
  );

  alert(
    "Your swim game has been saved on this device."
  );

}


/* =========================================================
   CLEAR
   ========================================================= */

function clearAll() {

  stopRecording();

  document.getElementById("mess").value = "";

  document.getElementById("result").innerText = "";

  document.getElementById("resultCard").style.display =
    "none";

  finalTranscript = "";

}

</script>

</body>
</html>
