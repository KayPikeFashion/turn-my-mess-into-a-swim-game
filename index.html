<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Turn My Mess Into a Swim Game</title>

<style>

body {
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  margin: 0;
  padding: 20px;
  text-align: center;
}

.container {
  max-width: 700px;
  margin: auto;
}

h1 {
  margin-bottom: 8px;
}

.subtitle {
  color: #aaa;
  margin-bottom: 25px;
}

#micButton {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  border: none;
  background: #e94b35;
  color: white;
  font-size: 45px;
  cursor: pointer;
  margin: 10px auto 20px;
  display: block;
}

#micButton.recording {
  background: #36a85c;
}

#status {
  min-height: 25px;
  color: #aaa;
  margin-bottom: 15px;
}

textarea {
  width: 100%;
  min-height: 180px;
  box-sizing: border-box;
  background: #222;
  color: white;
  border: 1px solid #444;
  border-radius: 10px;
  padding: 15px;
  font-size: 17px;
  resize: vertical;
}

button {
  font-size: 16px;
  border: none;
  border-radius: 8px;
  padding: 12px 18px;
  cursor: pointer;
}

#generateButton {
  margin-top: 15px;
  width: 100%;
  background: #f0c040;
  color: #111;
  font-weight: bold;
  font-size: 18px;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 15px;
}

.actions button {
  flex: 1;
  min-width: 100px;
  background: #333;
  color: white;
}

#resultCard {
  display: none;
  text-align: left;
  margin-top: 30px;
  background: #1d1d1d;
  border: 1px solid #444;
  border-radius: 12px;
  padding: 20px;
}

#result {
  white-space: pre-wrap;
  line-height: 1.5;
}

.loading {
  opacity: 0.6;
  pointer-events: none;
}

#connectionFrame {
  display: none;
}

</style>
</head>


<body>

<div class="container">

  <h1>Turn My Mess Into a Swim Game</h1>

  <div class="subtitle">
    Say it messy. We'll turn it into something teachable.
  </div>


  <button id="micButton" onclick="toggleRecording()">🎤</button>

  <div id="status">Ready to record.</div>


  <textarea
    id="mess"
    placeholder="Click the microphone and describe your swim game..."
  ></textarea>


  <button id="generateButton" onclick="generateGame()">
    Turn My Mess Into A Swim Game
  </button>


  <div id="resultCard">

    <div id="result"></div>

    <div class="actions">

      <button onclick="copyResult()">Copy</button>

      <button onclick="downloadResult()">Download</button>

      <button onclick="shareResult()">Share</button>

      <button onclick="printResult()">Print</button>

      <button onclick="saveResult()">Save</button>

      <button onclick="clearResult()">Clear</button>

    </div>

  </div>

</div>


<!--
  This hidden iframe receives the Apps Script response.
  It lets the GitHub page communicate with Apps Script
  without using fetch/CORS.
-->
<iframe
  id="connectionFrame"
  name="connectionFrame">
</iframe>


<!--
  Hidden form used to send the messy idea to Apps Script.
-->
<form
  id="appsScriptForm"
  method="POST"
  target="connectionFrame"
  action="https://script.google.com/macros/s/AKfycbxf4n39tX-1olKwTeZIvg34J_jTHbDbBu8gfRu3pgsdWaL3sih3mNZwJPxrugHCGvpRvw/exec">

  <input
    type="hidden"
    name="mess"
    id="appsScriptMess">

  <input
    type="hidden"
    name="requestId"
    id="appsScriptRequestId">

</form>


<script>

/* =========================================================
   SPEECH RECOGNITION
   ========================================================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;
let recording = false;

let finalTranscript = "";


if (SpeechRecognition) {

  recognition = new SpeechRecognition();

  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = "en-CA";


  recognition.onstart = function() {

    recording = true;

    document
      .getElementById("micButton")
      .classList.add("recording");

    document.getElementById("status").textContent =
      "Recording…";

  };


  recognition.onresult = function(event) {

    let interimTranscript = "";

    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {

      const transcript =
        event.results[i][0].transcript;

      if (event.results[i].isFinal) {

        finalTranscript += transcript + " ";

      } else {

        interimTranscript += transcript;

      }

    }


    document.getElementById("mess").value =
      finalTranscript + interimTranscript;

  };


  recognition.onerror = function(event) {

    console.log("Speech recognition error:", event.error);

    if (event.error === "not-allowed") {

      document.getElementById("status").textContent =
        "Microphone permission was denied.";

    } else {

      document.getElementById("status").textContent =
        "Microphone error: " + event.error;

    }

  };


  recognition.onend = function() {

    if (recording) {

      try {
        recognition.start();
      } catch (e) {
        console.log(e);
      }

    }

  };

}


/* =========================================================
   MICROPHONE
   ========================================================= */

function toggleRecording() {

  if (!recognition) {

    document.getElementById("status").textContent =
      "Speech recognition is not available in this browser.";

    return;

  }


  if (!recording) {

    finalTranscript =
      document.getElementById("mess").value;

    try {

      recognition.start();

    } catch (e) {

      console.log(e);

    }

  } else {

    recording = false;

    try {

      recognition.stop();

    } catch (e) {

      console.log(e);

    }


    document
      .getElementById("micButton")
      .classList.remove("recording");

    document.getElementById("status").textContent =
      "Recording stopped.";

  }

}


/* =========================================================
   GENERATE GAME
   ========================================================= */

function generateGame() {

  const mess =
    document.getElementById("mess").value.trim();


  if (!mess) {

    document.getElementById("status").textContent =
      "Please describe your swim game first.";

    return;

  }


  const generateButton =
    document.getElementById("generateButton");

  generateButton.classList.add("loading");

  generateButton.textContent =
    "Turning your mess into a game…";


  document.getElementById("status").textContent =
    "Creating your swim game…";


  document.getElementById("resultCard").style.display =
    "block";

  document.getElementById("result").textContent =
    "Thinking…";


  /*
   * Create a unique ID so we know which response belongs
   * to this request.
   */

  const requestId =
    Date.now().toString() +
    Math.random().toString(36).substring(2);


  document.getElementById("appsScriptMess").value =
    mess;

  document.getElementById("appsScriptRequestId").value =
    requestId;


  /*
   * Send the form to Apps Script.
   */

  document.getElementById("appsScriptForm").submit();

}


/* =========================================================
   RECEIVE RESPONSE FROM APPS SCRIPT
   ========================================================= */

window.addEventListener("message", function(event) {

  const data = event.data;


  if (!data) {
    return;
  }


  if (data.type !== "swimGameResult") {
    return;
  }


  const currentRequestId =
    document.getElementById("appsScriptRequestId").value;


  if (data.requestId !== currentRequestId) {
    return;
  }


  document.getElementById("result").textContent =
    data.text;


  document.getElementById("status").textContent =
    "Game created!";


  const generateButton =
    document.getElementById("generateButton");

  generateButton.classList.remove("loading");

  generateButton.textContent =
    "Turn My Mess Into A Swim Game";

});


/* =========================================================
   COPY
   ========================================================= */

function copyResult() {

  const text =
    document.getElementById("result").textContent;

  navigator.clipboard.writeText(text);

}


/* =========================================================
   DOWNLOAD
   ========================================================= */

function downloadResult() {

  const text =
    document.getElementById("result").textContent;

  const blob =
    new Blob([text], { type: "text/plain" });

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "swim-game.txt";

  a.click();

  URL.revokeObjectURL(url);

}


/* =========================================================
   SHARE
   ========================================================= */

async function shareResult() {

  const text =
    document.getElementById("result").textContent;


  if (navigator.share) {

    try {

      await navigator.share({
        title: "My Swim Game",
        text: text
      });

    } catch (e) {

      console.log(e);

    }

  } else {

    await navigator.clipboard.writeText(text);

    alert("Copied to clipboard.");

  }

}


/* =========================================================
   PRINT
   ========================================================= */

function printResult() {

  const text =
    document.getElementById("result").textContent;

  const printWindow =
    window.open("", "_blank");


  printWindow.document.write(`
    <html>
    <head>
      <title>Swim Game</title>
      <style>
        body {
          font-family: Arial, sans-serif;
          padding: 40px;
          white-space: pre-wrap;
          line-height: 1.5;
        }
      </style>
    </head>
    <body>${escapeHtml(text)}</body>
    </html>
  `);


  printWindow.document.close();

  printWindow.print();

}


/* =========================================================
   SAVE
   ========================================================= */

function saveResult() {

  const text =
    document.getElementById("result").textContent;

  localStorage.setItem(
    "savedSwimGame",
    text
  );

  alert("Swim game saved on this device.");

}


/* =========================================================
   CLEAR
   ========================================================= */

function clearResult() {

  document.getElementById("mess").value = "";

  document.getElementById("result").textContent = "";

  document.getElementById("resultCard").style.display =
    "none";

  finalTranscript = "";

  document.getElementById("status").textContent =
    "Ready to record.";

}


/* =========================================================
   HTML ESCAPING FOR PRINT
   ========================================================= */

function escapeHtml(text) {

  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
